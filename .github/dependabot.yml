# The Dockerfile pins its base image by digest, which means security patches no
# longer arrive on the next build. This is what turns that from a silent staleness
# problem into a prompted decision.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # The workflow pins actions by major tag (actions/checkout@v4). Those move too,
  # and a compromised action runs with the workflow's permissions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
