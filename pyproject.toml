[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "referral-loop"
version = "0.1.0"
description = "Inbound referral loop closure over HL7 v2"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0,<47",
]

[project.optional-dependencies]
# The coordinator worklist is an HTTP surface, not part of the kernel. Keeping it
# optional is what lets a listener-only deployment ship without a web framework.
worklist = ["flask>=3.1,<4.0"]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "flask>=3.1,<4.0",
]

[project.scripts]
referral-loop = "referral_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["referral_loop*"]

[tool.setuptools.package-data]
referral_loop = ["rules/*.json", "rules/*.sig", "rules/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
  "docker: shells out to `docker build`/`docker run`. Runs by default; deselected with -m 'not docker' by the spec 12/13 meta-test, whose in-process guards cannot reach a container anyway.",
]

[tool.coverage.run]
source = ["referral_loop"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
# Measured at 88% and set five points under. Do not ship the parent's 40; that floor
# is sized for a repo of loosely-tested analysis modules and this package would meet
# it by accident.
#
# 88 is a conservative reading: it was measured with Tasks 7 and 8 outstanding, so 79
# tests errored and contributed nothing. Coverage only rises as those are fixed -- the
# denominator is fixed by `source` above -- so the true figure is at or above 88 and
# this floor cannot be too high. Task 10 should re-measure and raise it.
fail_under = 83
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
exclude = ["tests/", "scripts/"]
