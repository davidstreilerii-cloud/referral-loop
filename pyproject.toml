[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "referral-loop"
version = "0.1.0"
description = "Inbound referral loop closure over HL7 v2"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0,<47",
]

[project.optional-dependencies]
# The coordinator worklist is an HTTP surface, not part of the kernel. Keeping it
# optional is what lets a listener-only deployment ship without a web framework.
worklist = ["flask>=3.1,<4.0"]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "flask>=3.1,<4.0",
]

[project.scripts]
referral-loop = "referral_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["referral_loop*"]

[tool.setuptools.package-data]
referral_loop = ["rules/*.json", "rules/*.sig", "rules/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
  "docker: shells out to `docker build`/`docker run`. Runs by default; deselected with -m 'not docker' by the spec 12/13 meta-test, whose in-process guards cannot reach a container anyway.",
]

[tool.coverage.run]
source = ["referral_loop"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
# Measured and set five points under. Do not ship the parent's 40; that floor is
# sized for a repo of loosely-tested analysis modules and this package would meet it
# by accident.
#
# Re-measured in Task 10 with the whole suite green: 95.24% on the CI invocation
# (`-m "not docker"`), against the 88% recorded when Tasks 7 and 8 were still
# outstanding and 79 tests errored without contributing. Floor raised 83 -> 90.
#
# The five points are not slack for regressions, they are platform margin: this was
# measured on win32, and encryption_check.py reads 51% there because its OS-detection
# branches are per-platform by construction. A Linux runner executes a different
# subset of that file. If CI ever lands between 90 and 95 the honest reading is that
# difference, not a regression -- check which lines moved before touching this number.
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
exclude = ["tests/", "scripts/"]
